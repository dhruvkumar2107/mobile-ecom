# ════════════════════════════════════════════════════════════════════════
# VOLTAGE — Continuous Integration
# ════════════════════════════════════════════════════════════════════════
# Runs on every push/PR. Validates:
#   - TypeScript types
#   - ESLint rules
#   - Prisma schema validity
#   - Next.js production build
#   - Unit/integration tests (when added)
# ════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build Next.js application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "file:./test.db"
          AUTH_SECRET: "test-secret-that-is-at-least-32-characters-long-for-ci"
          PAYMENT_DRIVER: "mock"
          PAYOUT_DRIVER: "mock"
          VERIFICATION_DRIVER: "mock"
          OTP_DRIVER: "console"
          MAIL_DRIVER: "console"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            public
          retention-days: 1

